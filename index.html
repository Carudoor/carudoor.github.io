<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>이용수</title>
<meta name="description" content="이용수 개인 홈페이지 — 단국대학교 도시계획학과, STL CAD 모델 3D 뷰어와 프로젝트 발표자료.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><circle cx='16' cy='16' r='14' fill='%232c2c2a'/><circle cx='16' cy='16' r='5' fill='%232563eb'/></svg>">
<link rel="stylesheet" href="slides-core.css?v=4">
<style>
  :root {
    --mm-text: #1f2937;
    --mm-text-secondary: #6b7280;
    --mm-line: #d1d5db;
    --mm-accent: #2563eb;
    --mm-root-fill: #2c2c2a;
    --mm-root-text: #ffffff;
  }
  * { box-sizing: border-box; }
  html { scroll-behavior: auto; }
  body {
    margin: 0;
    position: relative;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Apple SD Gothic Neo", "Noto Sans KR", sans-serif;
    background: #fafafa;
    color: var(--mm-text);
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1rem 4rem;
  }

  .site-header {
    width: 100%;
    max-width: 680px;
    margin: 0 auto 2rem;
    text-align: center;
  }
  .site-header h1 {
    margin: 0;
    font-size: 1.5rem;
    font-weight: 700;
    color: var(--mm-text);
  }
  .site-header p {
    margin: 6px 0 0;
    color: var(--mm-text-secondary);
    font-size: 0.95rem;
  }
  .skip-link { position: fixed; left: 1rem; top: 1rem; z-index: 100; transform: translateY(-160%); padding: 10px 14px; color: #fff; background: var(--mm-root-fill); border-radius: 6px; }
  .skip-link:focus { transform: translateY(0); }
  .site-nav { margin-top: 1rem; display: flex; justify-content: center; flex-wrap: wrap; gap: 8px; }
  .site-nav a { color: var(--mm-accent); padding: 8px 10px; text-decoration: none; border-radius: 5px; }
  .site-nav a:hover, .site-nav a:focus-visible { background: #e8efff; outline: 2px solid var(--mm-accent); outline-offset: 1px; }

  .mindmap {
    width: 100%;
    max-width: 680px;
    position: relative;
    z-index: 1;
  }
  .mindmap svg {
    width: 100%;
    height: auto;
    display: block;
  }
  .mindmap-list { display: none; }
  .mm-branch, .mm-leaf {
    cursor: pointer;
  }
  .mm-branch:focus-visible circle,
  .mm-leaf:focus-visible circle {
    outline: 2px solid var(--mm-accent);
    outline-offset: 2px;
  }
  .mm-children {
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s ease;
  }
  .mm-children.open {
    opacity: 1;
    pointer-events: auto;
  }
  .mm-branch:hover circle.mm-dot,
  .mm-leaf:hover circle.mm-dot {
    filter: brightness(1.1);
  }
  .mm-connector {
    transition: stroke 0.25s ease, stroke-width 0.25s ease;
  }
  .mm-label-main {
    font-size: 15px;
    font-weight: 600;
    fill: var(--mm-text);
  }
  .mm-label-sub {
    font-size: 13px;
    font-weight: 400;
    fill: var(--mm-text-secondary);
  }
  .mm-label-root {
    font-size: 16px;
    font-weight: 600;
    fill: var(--mm-root-text);
  }

  #mm-leader-overlay {
    position: absolute;
    top: 0;
    left: 0;
    /* #mm-content은 z-index:1에 섹션마다 불투명 배경까지 있어서, 오버레이가
       그보다 낮으면(예전엔 0) 본문 칼럼 "안쪽" 좌표에 그리는 건 전부 가려진다.
       margin 밖에만 그린다는 전제(데스크톱 스파인)로 버텨왔는데, 모바일
       여정 선처럼 칼럼 안쪽 좌표(현재 위치 점 옆)에 그려야 하는 경우엔
       그 전제가 깨진다. pointer-events:none이라 클릭에는 영향 없으니
       아예 본문보다 위로 올려서 좌표에 상관없이 항상 보이게 한다. */
    z-index: 2;
    pointer-events: none;
  }
  .mm-spine {
    fill: none;
    stroke: var(--mm-line);
    stroke-dasharray: 4 4;
    opacity: 0.35;
  }
  .mm-spine-dot {
    stroke: #fafafa;
    stroke-width: 1.5;
    transition: r 0.2s ease, fill 0.2s ease;
  }
  .mm-spine-dot.mm-path-highlight {
    fill: var(--mm-accent) !important;
    r: 6;
  }
  .mm-spine-dot.mm-spine-dot-current {
    stroke: var(--mm-accent);
    stroke-width: 3;
    r: 5;
    transition: none;
  }
  .mm-scroll-dot {
    fill: #fafafa;
    stroke: var(--mm-accent);
    stroke-width: 2;
    opacity: 0.82;
    transition: cy 0.3s ease, opacity 0.2s ease;
  }
  .mm-mobile-track {
    fill: none;
    stroke: var(--mm-line);
    stroke-dasharray: 4 4;
    opacity: 0.35;
  }
  .mm-mobile-scroll-dot {
    fill: #fafafa;
    stroke: var(--mm-accent);
    stroke-width: 2;
    opacity: 0.82;
    transition: cy 0.3s ease, opacity 0.2s ease;
  }
  /* 클릭할 때마다 새로 만들어지는 강조선. stroke-dashoffset을 통해 실제로
     "그어지는" 움직임을 준다 — 세부 항목 클릭 시 중심→헤더 방향, 헤더 클릭
     시 헤더→중심 방향으로 draw 순서만 반대로 뒤집는다. */
  .mm-trace {
    fill: none;
    stroke-width: 2.5;
    stroke-linejoin: round;
    stroke-linecap: round;
    opacity: 0;
    transition: stroke-dashoffset 0.5s ease, opacity 0.2s ease;
  }
  .mm-trace.mm-trace-visible {
    opacity: 1;
  }

  #mm-content,
  .mm-content-fallback {
    width: 100%;
    max-width: 680px;
    margin-top: 2.5rem;
    display: flex;
    flex-direction: column;
    gap: 1.5rem;
    position: relative;
    z-index: 1;
  }
  .mm-section {
    border-top: 1px solid var(--mm-line);
    padding-top: 1rem;
    scroll-margin-top: 1.5rem;
    background: #fafafa;
  }
  .mm-section-header {
    margin: 0 0 0.5rem;
    font-size: 16px;
    font-weight: 600;
    color: var(--mm-text);
  }
  /* 헤더는 <h3>(제목 시맨틱 유지) 안의 <button>이 클릭 대상이다.
     버튼의 기본 스타일만 지워 원래 제목처럼 보이게 한다. */
  .mm-section-header-btn {
    font: inherit;
    color: inherit;
    background: none;
    border: 0;
    padding: 0;
    cursor: pointer;
    text-align: left;
  }
  .mm-section-header-btn:hover,
  .mm-section-header-btn:focus-visible {
    color: var(--mm-accent);
  }
  .mm-section-header-btn:focus-visible {
    outline: 2px solid var(--mm-accent);
    outline-offset: 3px;
  }
  /* "지금 여기" 표시. 오버레이의 스파인 점(mm-spine-dot-current)은 마인드맵
     SVG가 보일 때만 의미가 있어서, 모바일에서도 항상 통하도록 헤더 자체에
     같은 역할의 점을 하나 더 둔다. 평소엔 옅은 빈 테두리만 있다가 현재
     항목일 때만 브랜치 색으로 채워진다. */
  .mm-current-mark {
    display: inline-block;
    width: 8px;
    height: 8px;
    margin-right: 8px;
    border-radius: 50%;
    border: 1.5px solid var(--mm-line);
    background: transparent;
    vertical-align: middle;
  }
  .mm-current-mark.mm-current-mark-active {
    border-color: var(--mm-accent);
    background: var(--mm-accent);
  }
  .mm-section-body {
    margin: 0;
    font-size: 14px;
    line-height: 1.6;
    color: var(--mm-text-secondary);
  }

  .mm-link-btn {
    display: inline-block;
    color: var(--mm-accent);
    text-decoration: none;
    font-size: 0.95rem;
    font-weight: 600;
    border: 1px solid var(--mm-accent);
    border-radius: 6px;
    padding: 8px 16px;
  }
  .mm-link-btn:hover {
    background: var(--mm-accent);
    color: #ffffff;
  }
  .mm-inline-link {
    color: var(--mm-accent);
    text-decoration: none;
  }
  .mm-inline-link:hover {
    text-decoration: underline;
  }

  /* Embedded 3D model preview (inside the "3D 모델 뷰어" leaf's content) —
     stays dark intentionally: the STL viewer's lighting/materials are
     designed for a dark background, a deliberate contrast against the
     light page around it. */
  .model-preview {
    position: relative;
    width: 100%;
    aspect-ratio: 16 / 9;
    min-height: clamp(180px, 42vw, 260px);
    border-radius: 8px;
    overflow: hidden;
    background: radial-gradient(ellipse at 50% 30%, #131722 0%, #0b0d12 70%);
    border: 1px solid var(--mm-line);
    margin-bottom: 12px;
  }
  .model-preview canvas {
    display: block;
    width: 100%;
    height: 100%;
    cursor: grab;
    touch-action: none;
  }
  .model-preview canvas:active {
    cursor: grabbing;
  }
  .model-preview-status {
    position: absolute;
    inset: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255, 255, 255, 0.55);
    font-size: 0.85rem;
    pointer-events: none;
  }
  .model-preview-hint {
    position: absolute;
    right: 10px;
    bottom: 8px;
    font-size: 0.7rem;
    color: rgba(255, 255, 255, 0.55);
    pointer-events: none;
  }
  .model-preview-controls { position: absolute; left: 10px; bottom: 8px; z-index: 2; }
  .model-preview-controls button { min-width: 44px; min-height: 44px; color: #fff; background: rgba(0,0,0,.55); border: 1px solid rgba(255,255,255,.55); border-radius: 5px; cursor: pointer; }
  .model-preview-error { pointer-events: auto; flex-direction: column; gap: 10px; }
  .model-preview-error a, .model-preview-error button { color: #fff; background: transparent; border: 1px solid rgba(255,255,255,.7); padding: 8px 10px; border-radius: 5px; }

  /* "프로젝트" 항목 안에 들어가는 슬라이드 덱. 바깥 상자 크기만 정하고
     내부 스타일은 slides-core.css가 담당한다. */
  .deck-card {
    width: 100%;
    aspect-ratio: 16 / 10;
    min-height: clamp(220px, 52vw, 300px);
    border-radius: 8px;
    border: 1px solid var(--mm-line);
    margin-bottom: 12px;
  }

  footer {
    width: 100%;
    max-width: 680px;
    margin-top: 2.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--mm-line);
    color: var(--mm-text-secondary);
    font-size: 0.85rem;
    text-align: center;
  }
  .mm-breadcrumb { margin: 0 0 -.5rem; color: var(--mm-text-secondary); font-size: .9rem; min-height: 1.4em; }
  .mm-breadcrumb[hidden] { display: none; }
  @media (max-width: 600px) {
    body { padding-top: 1.5rem; }
    .mindmap svg { display: none; }
    .mm-spine,
    .mm-spine-dot,
    .mm-trace { display: none; }
    .mindmap-list { display: block; border-top: 1px solid var(--mm-line); }
    .mindmap-list details { border-bottom: 1px solid var(--mm-line); }
    .mindmap-list summary { min-height: 44px; display: flex; align-items: center; padding: 10px 4px; cursor: pointer; font-weight: 600; }
    .mindmap-list summary::after { content: '펼치기'; margin-left: auto; color: var(--mm-text-secondary); font-size: .8rem; font-weight: 400; }
    .mindmap-list details[open] summary::after { content: '접기'; }
    .mindmap-list ul { list-style: none; margin: 0; padding: 0 0 8px; }
    .mindmap-list a { display: flex; align-items: center; min-height: 44px; padding: 8px 10px 8px 20px; color: var(--mm-text); text-decoration: none; }
    .mindmap-list a::before { content: '→'; margin-right: 8px; color: var(--mm-accent); }
  }

  @media (min-width: 601px) {
    .mm-mobile-track,
    .mm-mobile-scroll-dot { display: none; }
  }

  /* 모션 최소화 설정에서는 JS(스크롤·회전·선 그리기)뿐 아니라
     CSS 트랜지션도 함께 꺼서 실제로 움직임이 남지 않게 한다. */
  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    .mm-children,
    .mm-connector,
    .mm-spine-dot,
    .mm-scroll-dot,
    .mm-mobile-scroll-dot,
    .mm-trace {
      transition: none !important;
    }
  }
</style>
</head>
<body>
<a class="skip-link" href="#mm-content">본문으로 건너뛰기</a>

<header class="site-header">
  <h1>이용수</h1>
  <p>개인 홈페이지에 오신 것을 환영합니다. 아래 마인드맵의 항목을 눌러보세요.</p>
  <nav class="site-nav" aria-label="주요 섹션">
    <a href="#content-0-0">소개</a>
    <a href="#content-1-0">3D 모델·프로젝트</a>
    <a href="#content-2-0">대외·개인활동</a>
  </nav>
</header>

<svg id="mm-leader-overlay" aria-hidden="true"></svg>
<div class="mindmap" id="mindmap-root"></div>
<div id="mm-content"></div>

<!-- 마인드맵과 본문은 스크립트로 생성되므로, JS가 꺼진 환경에서도
     핵심 정보는 읽을 수 있도록 최소한의 대체 내용을 둔다. -->
<noscript>
  <div class="mm-content-fallback">
    <section class="mm-section">
      <h3 class="mm-section-header">소개</h3>
      <div class="mm-section-body">안녕하세요, 이용수입니다. 이곳은 저를 소개하는 개인 홈페이지입니다.</div>
    </section>
    <section class="mm-section">
      <h3 class="mm-section-header">학력사항</h3>
      <div class="mm-section-body">단국대학교 도시계획학과.</div>
    </section>
    <section class="mm-section">
      <h3 class="mm-section-header">3D 모델 / 프로젝트</h3>
      <div class="mm-section-body">
        STL로 제작한 CAD 모델은 <a href="viewer.html" class="mm-inline-link">3D 뷰어</a>에서,
        프로젝트 발표자료는 <a href="slides.html" class="mm-inline-link">슬라이드 뷰어</a>에서 볼 수 있습니다.
      </div>
    </section>
    <section class="mm-section">
      <h3 class="mm-section-header">대외/개인활동</h3>
      <div class="mm-section-body">대외활동 및 개인활동 내용을 준비 중입니다.</div>
    </section>
  </div>
</noscript>

<footer>&copy; 2026 이용수. All rights reserved.</footer>

<!-- head가 아닌 본문 끝에서 불러온다: three.js는 600KB 가까이 되는데
     head에 두면 HTML 파싱을 막아 첫 화면이 그만큼 늦게 그려진다.
     아래 인라인 스크립트보다는 먼저 실행되어야 하므로 순서는 유지. -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="stl-core.js?v=1"></script>
<script src="slides-core.js?v=4"></script>
<script>
(function () {
  var NS = 'http://www.w3.org/2000/svg';

  // 데이터: label/children 텍스트와 브랜치를 필요에 맞게 수정하세요.
  // text: 일반 텍스트 본문 / render(bodyEl): 커스텀 콘텐츠(링크, 3D 미리보기 등)를 직접 그릴 때 사용.
  var data = {
    label: '이용수',
    children: [
      { label: '소개', color: '#2563eb', children: [
        { label: '자기소개', text: '안녕하세요, 이용수입니다. 이곳은 저를 소개하는 개인 홈페이지입니다.' },
        { label: '학력사항', text: '단국대학교 도시계획학과.' }
      ]},
      { label: '3D 모델 / 프로젝트', color: '#D85A30', children: [
        { label: '3D 모델 뷰어', render: function (body) {
          body.innerHTML =
            '<div class="model-preview">' +
              '<div class="model-preview-status">모델 불러오는 중…</div>' +
              '<div class="model-preview-hint">드래그 · 회전 &nbsp;/&nbsp; 스크롤 · 확대</div>' +
              '<div class="model-preview-controls"><button type="button" class="model-preview-toggle" aria-pressed="false">자동회전 일시정지</button></div>' +
            '</div>' +
            '<p style="margin:0 0 10px;">STL 3D 모델을 홀로그램 스타일로 볼 수 있는 뷰어입니다.</p>' +
            '<a href="viewer.html" class="mm-link-btn">전체 뷰어 열기 →</a>';
          initModelPreview(body.querySelector('.model-preview'), body.querySelector('.model-preview-status'));
        }},
        { label: '프로젝트', render: function (body) {
          body.innerHTML =
            '<div class="deck-card"></div>' +
            '<p style="margin:0 0 10px;">프로젝트 발표자료입니다.</p>' +
            '<a href="slides.html" class="mm-link-btn">전체 화면으로 보기 →</a>';
          mountSlideDeck(body.querySelector('.deck-card'), {
            manifestUrl: 'slides/manifest.json',
            basePath: 'slides/',
            filmstrip: false,
            dots: false,      // 좁은 카드에서는 점 네비게이션 생략
            progress: true,
            keyboard: false,  // 페이지 전체의 방향키를 가로채지 않도록
            emptyText: '아직 등록된 발표자료가 없습니다. 저장소의 slides/ 에 덱 폴더를 만들어 PNG를 넣고 slides/manifest.json에 등록하면 표시됩니다.'
          });
        }}
      ]},
      { label: '대외/개인활동', color: '#059669', children: [
        { label: '대외활동', text: '대외활동 내용을 여기에 작성하세요.' },
        { label: '개인활동', text: '개인활동 내용을 여기에 작성하세요.' }
      ]}
    ]
  };

  var prefersReduced = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;
  var scrollDuration = 1100;

  function easeInOutQuad(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }

  function smoothScrollTo(targetY) {
    targetY = Math.max(0, targetY);
    if (prefersReduced) { window.scrollTo(0, targetY); return; }
    var startY = window.pageYOffset;
    var diff = targetY - startY;
    if (Math.abs(diff) < 1) return;
    var start = null;
    function step(ts) {
      if (!start) start = ts;
      var t = Math.min((ts - start) / scrollDuration, 1);
      window.scrollTo(0, startY + diff * easeInOutQuad(t));
      if (t < 1) requestAnimationFrame(step);
    }
    requestAnimationFrame(step);
  }

  function scrollElementToCenter(target) {
    var rect = target.getBoundingClientRect();
    smoothScrollTo(rect.top + window.pageYOffset - (window.innerHeight / 2 - rect.height / 2));
  }

  function scrollElementToTop(target, offset) {
    var rect = target.getBoundingClientRect();
    smoothScrollTo(rect.top + window.pageYOffset - (offset || 20));
  }

  // ---------------------------------------------------------------
  // Embedded 3D model preview — same STL parser (stl-core.js) and
  // orbit/zoom interaction as viewer.html, just a lightweight scene
  // bound to whatever container element it's given.
  // ---------------------------------------------------------------
  function initModelPreview(container, statusEl) {
    if (!container || typeof THREE === 'undefined') return;
    container.setAttribute('role', 'region');
    container.setAttribute('aria-label', '회전 가능한 3D 도시 모델 미리보기');
    if (statusEl) { statusEl.setAttribute('role', 'status'); statusEl.setAttribute('aria-live', 'polite'); }

    var scene = new THREE.Scene();
    var camera = new THREE.PerspectiveCamera(40, container.clientWidth / container.clientHeight, 0.1, 1000);
    var renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.setSize(container.clientWidth, container.clientHeight);
    container.appendChild(renderer.domElement);
    renderer.domElement.setAttribute('aria-label', '3D 도시 모델 캔버스. 드래그하여 회전하고 스크롤하여 확대합니다.');
    renderer.domElement.setAttribute('role', 'img');

    scene.add(new THREE.AmbientLight(0x8899aa, 1.1));
    var keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
    keyLight.position.set(4, 6, 6);
    scene.add(keyLight);
    var rimLight = new THREE.DirectionalLight(0x5b8def, 0.8);
    rimLight.position.set(-5, -2, -4);
    scene.add(rimLight);

    var modelGroup = new THREE.Group();
    scene.add(modelGroup);

    // 모델 파일은 파일명이 곧 버전이라 브라우저 캐시를 그대로 쓴다
    // (no-store로 두면 재방문마다 통째로 다시 받는다).
    function loadModel() {
      if (statusEl) { statusEl.classList.remove('model-preview-error'); statusEl.textContent = '모델 불러오는 중…'; statusEl.style.display = ''; }
      fetch('stl/small-city.stl')
      .then(function (res) {
        if (!res.ok) throw new Error('HTTP ' + res.status);
        return res.arrayBuffer();
      })
      .then(function (buffer) {
        var geometry = parseSTL(buffer);
        modelGroup.scale.setScalar(fitGeometryToSize(geometry, 4).scale);

        var material = new THREE.MeshPhongMaterial({
          color: 0x1c2b45,
          emissive: 0x25406e,
          emissiveIntensity: 0.4,
          specular: 0x5b8def,
          shininess: 60
        });
        modelGroup.add(new THREE.Mesh(geometry, material));

        var edges = new THREE.LineSegments(
          new THREE.EdgesGeometry(geometry, 20),
          new THREE.LineBasicMaterial({ color: 0x8fb0ff, transparent: true, opacity: 0.5 })
        );
        modelGroup.add(edges);

        if (statusEl) statusEl.style.display = 'none';
        animate();
      })
      .catch(function (err) {
        console.error(err);
        if (statusEl) {
          statusEl.classList.add('model-preview-error');
          statusEl.innerHTML = '모델을 불러올 수 없습니다.<span><button type="button" class="model-preview-retry">다시 시도</button> <a href="viewer.html">전체 화면 뷰어</a></span>';
          statusEl.querySelector('.model-preview-retry').addEventListener('click', loadModel);
        }
      });
    }
    loadModel();

    var spherical = { radius: 7, theta: 0.6, phi: 1.15 };
    var target = new THREE.Vector3(0, 0.3, 0);
    var isDragging = false;
    var lastX = 0, lastY = 0;
    var autoRotate = true;
    var isRotationPaused = false;
    var rotateToggle = container.querySelector('.model-preview-toggle');
    if (rotateToggle) rotateToggle.addEventListener('click', function () {
      isRotationPaused = !isRotationPaused;
      rotateToggle.setAttribute('aria-pressed', String(isRotationPaused));
      rotateToggle.textContent = isRotationPaused ? '자동회전 재개' : '자동회전 일시정지';
      if (statusEl) { statusEl.style.display = ''; statusEl.textContent = isRotationPaused ? '자동회전을 일시정지했습니다.' : '자동회전을 재개했습니다.'; setTimeout(function () { if (!statusEl.classList.contains('model-preview-error')) statusEl.style.display = 'none'; }, 1200); }
    });

    function updateCameraFromSpherical() {
      var r = spherical.radius, t = spherical.theta, p = spherical.phi;
      camera.position.x = target.x + r * Math.sin(p) * Math.sin(t);
      camera.position.y = target.y + r * Math.cos(p);
      camera.position.z = target.z + r * Math.sin(p) * Math.cos(t);
      camera.lookAt(target);
    }
    updateCameraFromSpherical();

    // viewer.html과 같은 방식: 자동 회전은 계속 돌고, 잡고 있는 동안(isDragging)만
    // 멈춘다. 손을 떼면 바로 다시 회전한다.
    var canvasEl = renderer.domElement;

    canvasEl.addEventListener('mousedown', function (e) {
      isDragging = true;
      lastX = e.clientX; lastY = e.clientY;
    });
    window.addEventListener('mouseup', function () { isDragging = false; });
    window.addEventListener('mousemove', function (e) {
      if (!isDragging) return;
      var dx = e.clientX - lastX, dy = e.clientY - lastY;
      lastX = e.clientX; lastY = e.clientY;
      spherical.theta -= dx * 0.008;
      spherical.phi -= dy * 0.008;
      spherical.phi = Math.max(0.2, Math.min(Math.PI - 0.2, spherical.phi));
      updateCameraFromSpherical();
    });

    canvasEl.addEventListener('wheel', function (e) {
      e.preventDefault();
      spherical.radius *= (1 + e.deltaY * 0.001);
      spherical.radius = Math.max(2, Math.min(20, spherical.radius));
      updateCameraFromSpherical();
    }, { passive: false });

    var touchLastX = 0, touchLastY = 0, touchStartDist = null;
    canvasEl.addEventListener('touchstart', function (e) {
      isDragging = true; // 손가락을 대고 있는 동안에도 회전을 멈춘다
      if (e.touches.length === 1) {
        touchLastX = e.touches[0].clientX;
        touchLastY = e.touches[0].clientY;
      } else if (e.touches.length === 2) {
        var dx = e.touches[0].clientX - e.touches[1].clientX;
        var dy = e.touches[0].clientY - e.touches[1].clientY;
        touchStartDist = Math.sqrt(dx * dx + dy * dy);
      }
    }, { passive: true });

    canvasEl.addEventListener('touchmove', function (e) {
      if (e.touches.length === 1) {
        var dx = e.touches[0].clientX - touchLastX;
        var dy = e.touches[0].clientY - touchLastY;
        touchLastX = e.touches[0].clientX;
        touchLastY = e.touches[0].clientY;
        spherical.theta -= dx * 0.009;
        spherical.phi -= dy * 0.009;
        spherical.phi = Math.max(0.2, Math.min(Math.PI - 0.2, spherical.phi));
        updateCameraFromSpherical();
      } else if (e.touches.length === 2 && touchStartDist !== null) {
        var ddx = e.touches[0].clientX - e.touches[1].clientX;
        var ddy = e.touches[0].clientY - e.touches[1].clientY;
        var dist = Math.sqrt(ddx * ddx + ddy * ddy);
        var delta = dist - touchStartDist;
        touchStartDist = dist;
        spherical.radius *= (1 - delta * 0.006);
        spherical.radius = Math.max(2, Math.min(20, spherical.radius));
        updateCameraFromSpherical();
      }
    }, { passive: true });

    // 손가락을 모두 떼면 바로 자동 회전으로 돌아간다
    ['touchend', 'touchcancel'].forEach(function (evt) {
      canvasEl.addEventListener(evt, function (e) {
        if (e.touches.length === 0) {
          isDragging = false;
          touchStartDist = null;
        }
      }, { passive: true });
    });

    function animate() {
      requestAnimationFrame(animate);
      if (autoRotate && !isDragging && !isRotationPaused) {
        spherical.theta += 0.0025;
        updateCameraFromSpherical();
      }
      renderer.render(scene, camera);
    }

    // 컨테이너 크기가 0인 상태(백그라운드 탭, 아직 레이아웃 전 등)에서 초기화되면
    // 캔버스가 0px로 굳어버린다. window 리사이즈만 듣고 있으면 나중에 컨테이너가
    // 실제 크기를 얻어도 복구되지 않으므로, 컨테이너 자체를 관찰한다.
    var lastW = 0, lastH = 0;
    function resizeToContainer() {
      var w = container.clientWidth, h = container.clientHeight;
      if (!w || !h || (w === lastW && h === lastH)) return;
      lastW = w; lastH = h;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    if (typeof ResizeObserver !== 'undefined') {
      new ResizeObserver(resizeToContainer).observe(container);
    }
    window.addEventListener('resize', resizeToContainer);
  }

  // 모바일 스크롤을 고려해 트리는 항상 아래로만 자란다: 중심 → 브랜치 행 → 세부 브랜치 행
  var cx = 340;
  var Y0 = 75, Y1 = 210, Y2 = 350;
  var centralR = 48, dotR2 = 11, dotR3 = 7;
  var n = data.children.length;
  var branchMargin = 130;
  var branchSpacing = n > 1 ? (680 - 2 * branchMargin) / (n - 1) : 0;
  var childSpread = 90;

  function slotX(slot) { return n > 1 ? branchMargin + slot * branchSpacing : cx; }
  function childOffset(count, j) { return count === 1 ? 0 : -childSpread / 2 + j * (childSpread / (count - 1)); }

  function el(tag, attrs, parent, text) {
    var e = document.createElementNS(NS, tag);
    for (var k in attrs) e.setAttribute(k, attrs[k]);
    if (text !== undefined) e.textContent = text;
    if (parent) parent.appendChild(e);
    return e;
  }

  // 대각으로 나왔다가 아래로 뻗는 연결선 경로 (elbow connector). 항상 아래 방향으로만 그려진다.
  function elbowPath(xa, ya, xb, yb, fraction) {
    var bendY = ya + (yb - ya) * fraction;
    return 'M ' + xa + ' ' + ya + ' L ' + xb + ' ' + bendY + ' L ' + xb + ' ' + yb;
  }

  // 모든 헤더를 세로로 관통하는 스파인의 x좌표(페이지 좌표).
  // 강조선과 스파인 배치가 같은 값을 써야 하므로 한 곳에서만 계산한다.
  function getSpineX() {
    var firstHeaderRect = headerEls[0][0].getBoundingClientRect();
    return Math.max(4, firstHeaderRect.left - 12 + window.pageXOffset);
  }

  var svg = el('svg', { viewBox: '0 0 680 430', role: 'img', 'aria-labelledby': 'mm-title mm-desc' });
  el('title', { id: 'mm-title' }, svg, '마인드맵');
  el('desc', { id: 'mm-desc' }, svg, '이용수라는 중심 주제에서 아래로 뻗어나가는 브랜치형 마인드맵. 세부 항목을 클릭하면 관련 내용으로 이동합니다.');

  // offsetParent만으로는 폭이 0인 과도기 상태(레이아웃 리플로우 중)를 걸러내지
  // 못하므로, 실제 렌더된 크기까지 함께 확인해 "그릴 수 있는 상태인지" 판단한다.
  function svgMapVisible() {
    if (svg.offsetParent === null) return false;
    var r = svg.getBoundingClientRect();
    return r.width > 0 && r.height > 0;
  }

  var linesLayer = el('g', {}, svg);
  var nodesLayer = el('g', {}, svg);

  // 중심 노드
  var rootG = el('g', {}, nodesLayer);
  var rootCircle = el('circle', { cx: cx, cy: Y0, r: centralR, fill: 'var(--mm-root-fill)' }, rootG);
  el('text', { class: 'mm-label-root', x: cx, y: Y0, 'text-anchor': 'middle', 'dominant-baseline': 'central' }, rootG, data.label);

  var branchPaths = [], branchDots = [], branchLabelEls = [];
  var childPaths = [], leafCircles = [], leafLabelEls = [];
  var headerEls = [], spineDots = [];
  var currentSpineDot = null;
  var currentHeaderMark = null;
  var branchGEls = [], childrenGEls = [];
  var contentContainer = document.getElementById('mm-content');
  contentContainer.setAttribute('tabindex', '-1');
  var breadcrumb = document.createElement('p');
  breadcrumb.className = 'mm-breadcrumb';
  breadcrumb.hidden = true;
  contentContainer.parentNode.insertBefore(breadcrumb, contentContainer);
  var listView = document.createElement('div');
  listView.className = 'mindmap-list';
  listView.setAttribute('aria-label', '마인드맵 목록');
  document.getElementById('mindmap-root').appendChild(listView);
  var overlay = document.getElementById('mm-leader-overlay');
  var spineLine = el('path', { class: 'mm-spine' }, overlay);
  // 클릭할 때마다 새로 그려지는 강조선(중심 ↔ 헤더). 미리 그려두지 않고,
  // 클릭 시 방향에 맞춰 경로를 만든 뒤 stroke-dashoffset으로 "그어지는" 애니메이션을 준다.
  var traceEl = el('path', { class: 'mm-trace' }, overlay);
  // 클릭 기반 확정 현재점과 별개로, 읽고 있는 본문 위치를 표시하는 단일 점.
  var scrollProgressDot = el('circle', {
    class: 'mm-scroll-dot', r: 3.25, visibility: 'hidden'
  }, overlay);
  var mobileTrack = el('path', { class: 'mm-mobile-track' }, overlay);
  var mobileScrollDot = el('circle', {
    class: 'mm-mobile-scroll-dot', r: 3.25, visibility: 'hidden'
  }, overlay);
  var mobileTrackX = null;
  var scrollCurrentSection = null;

  var currentOrder = [];
  for (var oi = 0; oi < n; oi++) currentOrder.push(oi);

  // 각 브랜치 내부 세부 항목의 표시 순서
  var childOrders = [];
  for (var ci = 0; ci < n; ci++) {
    var co = [];
    for (var cj = 0; cj < data.children[ci].children.length; cj++) co.push(cj);
    childOrders.push(co);
  }

  var activeHighlight = false;
  var activeBranchIndex = null;
  var activeLeafIndex = null;
  var activeSpineDot = null;

  function setChildrenState(i, open) {
    var group = childrenGEls[i], branch = branchGEls[i];
    if (!group || !branch) return;
    group.classList.toggle('open', open);
    group.setAttribute('aria-hidden', String(!open));
    branch.setAttribute('aria-expanded', String(open));
    branch.setAttribute('aria-label', data.children[i].label + (open ? ' 세부 항목 접기' : ' 세부 항목 펼치기'));
    Array.prototype.forEach.call(group.querySelectorAll('.mm-leaf'), function (leaf) { leaf.setAttribute('tabindex', open ? '0' : '-1'); });
  }

  function showBreadcrumb(i, j) {
    breadcrumb.textContent = data.children[i].label + ' › ' + data.children[i].children[j].label;
    breadcrumb.hidden = false;
  }

  function clearHighlight() {
    if (!activeHighlight) return;
    traceEl.classList.remove('mm-trace-visible');
    if (activeSpineDot) activeSpineDot.classList.remove('mm-path-highlight');
    activeSpineDot = null;
    activeHighlight = false;
    activeBranchIndex = null;
    activeLeafIndex = null;
  }

  function setCurrentSpineDot(i, j) {
    if (currentSpineDot) currentSpineDot.classList.remove('mm-spine-dot-current');
    currentSpineDot = spineDots[i] && spineDots[i][j];
    if (currentSpineDot) currentSpineDot.classList.add('mm-spine-dot-current');

    // 헤더 옆 점은 SVG 마인드맵이 보이지 않는 모바일에서도 항상 통하는
    // "지금 여기" 표시라 스파인 점과 별도로 관리한다.
    if (currentHeaderMark) currentHeaderMark.classList.remove('mm-current-mark-active');
    var header = headerEls[i] && headerEls[i][j];
    currentHeaderMark = header && header.querySelector('.mm-current-mark');
    if (currentHeaderMark) currentHeaderMark.classList.add('mm-current-mark-active');
  }

  // 화면에 실제로 그려진 위치(getBoundingClientRect)를 기준으로 점을 구한다.
  // 메인 svg(뷰박스 좌표)와 오버레이 svg(페이지 픽셀 좌표)가 서로 다른 좌표계라,
  // 강조선은 오버레이 위에 페이지 좌표로 통일해서 그린다.
  function pointOf(target) {
    var r = target.getBoundingClientRect();
    return [r.left + r.width / 2 + window.pageXOffset, r.top + r.height / 2 + window.pageYOffset];
  }

  function layoutMobileTrack() {
    var marks = contentContainer.querySelectorAll('.mm-section-header .mm-current-mark');
    if (!marks.length) return;

    // 마크 정중앙을 그대로 쓴다 — 예전엔 이게 본문 칼럼 "안쪽" 좌표라
    // .mm-section의 불투명 배경에 가려질까봐 여백 쪽으로 옮겼었는데,
    // (좁은 화면에선 여백이 거의 없어서 그 회피책도 부족했다) 대신
    // #mm-leader-overlay 자체를 본문보다 위로 올려서 근본적으로 해결했다
    // (아래 z-index 관련 CSS 주석 참고). 이제 좌표는 그냥 마크 위치 그대로.
    var firstPoint = pointOf(marks[0]);
    var lastPoint = pointOf(marks[marks.length - 1]);
    mobileTrackX = firstPoint[0];
    mobileTrack.setAttribute('d', 'M ' + mobileTrackX + ' ' + firstPoint[1] + ' L ' + mobileTrackX + ' ' + lastPoint[1]);
  }

  // 중심 → 브랜치 → 세부 항목 → 스파인 → 헤더를 잇는 하나의 연속된 경로(꺾은선)를 만든다.
  function buildTracePoints(i, j) {
    var root = pointOf(rootCircle);
    var branch = pointOf(branchDots[i]);
    var leaf = pointOf(leafCircles[i][j]);
    var headerRect = headerEls[i][j].getBoundingClientRect();
    // spineDots[i][j]의 cx는 layoutLeaderLines()가 실행된 뒤에야 채워지므로
    // (rAF로 예약됨) 그 값에 기대지 않고 스파인 x좌표를 여기서 직접 계산한다.
    var spineX = getSpineX();
    var headerPt = [spineX, headerRect.top + headerRect.height / 2 + window.pageYOffset];
    var bendPt = [spineX, Math.min(leaf[1] + 50, headerPt[1])];
    return [
      root,
      [branch[0], root[1] + (branch[1] - root[1]) * 0.35],
      branch,
      [leaf[0], branch[1] + (leaf[1] - branch[1]) * 0.35],
      leaf,
      bendPt,
      headerPt
    ];
  }

  // direction: 'down' — 중심에서 헤더 쪽으로(세부 항목 클릭) / 'up' — 헤더에서 중심 쪽으로(헤더 클릭)
  function highlightPath(i, j, direction) {
    if (!svgMapVisible()) return; // 회전 애니메이션 도중 모바일 폭으로 리사이즈된 경우
    var pts = buildTracePoints(i, j);
    // 레이아웃이 아직 잡히지 않았으면 좌표에 NaN이 섞일 수 있다.
    // 그대로 두면 getTotalLength()에서 터지므로 조용히 건너뛴다.
    var valid = pts.every(function (p) { return isFinite(p[0]) && isFinite(p[1]); });
    if (!valid) return;

    if (direction === 'up') pts = pts.slice().reverse();

    var d = 'M ' + pts.map(function (p) { return p[0] + ' ' + p[1]; }).join(' L ');
    traceEl.setAttribute('d', d);
    traceEl.setAttribute('stroke', data.children[i].color);

    if (prefersReduced) {
      traceEl.style.transition = 'none';
      traceEl.style.strokeDasharray = 'none';
      traceEl.style.strokeDashoffset = 0;
    } else {
      var len = traceEl.getTotalLength();
      traceEl.style.transition = 'none';
      traceEl.style.strokeDasharray = len;
      traceEl.style.strokeDashoffset = len;
      void traceEl.getBoundingClientRect(); // 강제 리플로우: 아래 transition이 실제로 애니메이션되도록
      traceEl.style.transition = '';
      traceEl.style.strokeDashoffset = 0;
    }
    traceEl.classList.add('mm-trace-visible');

    if (spineDots[i] && spineDots[i][j]) {
      spineDots[i][j].classList.add('mm-path-highlight');
      activeSpineDot = spineDots[i][j];
    }
    activeHighlight = true;
    activeBranchIndex = i;
    activeLeafIndex = j;
  }

  // 창 크기가 바뀌면 노드·헤더 위치가 전부 달라진다. 강조선이 떠 있는
  // 상태라면 경로만 새 좌표로 다시 그려준다(애니메이션 없이 즉시).
  function refreshHighlightGeometry() {
    if (!activeHighlight || activeBranchIndex === null || activeLeafIndex === null) return;
    if (!svgMapVisible()) {
      // 모바일 아코디언 뷰로 좁아져 마인드맵 SVG가 숨겨지면 root/branch/leaf
      // 좌표가 전부 (0,0)으로 읽혀 강조선이 화면 구석으로 튀어 보인다.
      // 그릴 수 없는 상태이므로 차라리 지운다 — 리사이즈로 다시 넓어지면
      // 다음 클릭 때 정상 좌표로 새로 그려진다.
      clearHighlight();
      return;
    }
    var pts = buildTracePoints(activeBranchIndex, activeLeafIndex);
    if (!pts.every(function (p) { return isFinite(p[0]) && isFinite(p[1]); })) return;
    traceEl.setAttribute('d', 'M ' + pts.map(function (p) { return p[0] + ' ' + p[1]; }).join(' L '));
    traceEl.style.transition = 'none';
    traceEl.style.strokeDasharray = 'none';
    traceEl.style.strokeDashoffset = 0;
  }

  // 위치가 바뀔 때는 기존 선을 먼저 지우고(페이드 아웃이 끝난 뒤) 회전과 스크롤을 동시에 시작한다.
  var HIGHLIGHT_FADE = 260;

  function clearHighlightThen(needsMove, callback) {
    if (!activeHighlight || !needsMove || prefersReduced) {
      clearHighlight();
      callback();
      return;
    }
    clearHighlight();
    setTimeout(callback, HIGHLIGHT_FADE);
  }

  function goToContent(i, j) {
    setCurrentSpineDot(i, j);
    var target0 = document.getElementById('content-' + i + '-' + j);
    if (!svgMapVisible()) {
      // 모바일 아코디언 뷰에서는 SVG가 숨겨져 있어 위치 계산이 의미 없으므로
      // 회전·강조선 애니메이션 없이 스크롤·포커스·breadcrumb만 처리한다.
      if (target0) {
        scrollElementToCenter(target0);
        showBreadcrumb(i, j);
        target0.setAttribute('tabindex', '-1');
        target0.focus({ preventScroll: true });
      }
      return;
    }
    var needsMove = currentOrder.indexOf(i) !== 0 || childOrders[i].indexOf(j) !== 0;
    clearHighlightThen(needsMove, function () {
      // 회전과 스크롤을 동시에 진행하고, 회전이 끝나면 중심에서 헤더 방향으로 선을 그린다.
      var target = document.getElementById('content-' + i + '-' + j);
      if (target) {
        scrollElementToCenter(target);
        showBreadcrumb(i, j);
        target.setAttribute('tabindex', '-1');
        target.focus({ preventScroll: true });
      }
      moveToLeftmost(i, j, function () { highlightPath(i, j, 'down'); });
    });
  }

  function goToMap(i, j) {
    setCurrentSpineDot(i, j);
    breadcrumb.hidden = true;
    if (childrenGEls[i] && !childrenGEls[i].classList.contains('open')) {
      setChildrenState(i, true);
    }
    var needsMove = currentOrder.indexOf(i) !== 0 || childOrders[i].indexOf(j) !== 0;
    clearHighlightThen(needsMove, function () {
      scrollElementToTop(document.getElementById('mindmap-root'));
      moveToLeftmost(i, j, function () { highlightPath(i, j, 'up'); if (leafCircles[i] && leafCircles[i][j]) leafCircles[i][j].parentNode.focus({ preventScroll: true }); });
    });
  }

  // 선택한 브랜치를 가장 왼쪽으로 회전시키고, 세부 항목을 함께 지정했다면
  // 그 브랜치 안에서도 해당 항목이 가장 왼쪽에 오도록 회전시킨다.
  // (헤더로 이어지는 선이 최대한 짧고 곧게 보이도록)
  function moveToLeftmost(i, j, callback) {
    var idx = currentOrder.indexOf(i);
    var newOrder = idx === 0 ? currentOrder.slice()
      : currentOrder.slice(idx).concat(currentOrder.slice(0, idx));

    var newChildOrder = childOrders[i].slice();
    if (typeof j === 'number') {
      var cidx = newChildOrder.indexOf(j);
      if (cidx > 0) newChildOrder = newChildOrder.slice(cidx).concat(newChildOrder.slice(0, cidx));
    }

    var branchMoved = idx !== 0;
    var childMoved = newChildOrder.join() !== childOrders[i].join();
    if (!branchMoved && !childMoved) {
      if (callback) callback();
      return;
    }

    if (prefersReduced) {
      currentOrder = newOrder;
      childOrders[i] = newChildOrder;
      applyLayout();
      layoutLeaderLines();
      if (callback) callback();
      return;
    }

    animateReorder(newOrder, i, newChildOrder, 450, function () {
      layoutLeaderLines();
      if (callback) callback();
    });
  }

  function animateReorder(newOrder, movedBranch, newChildOrder, duration, done) {
    var oldOrder = currentOrder.slice();
    var oldChildOrder = childOrders[movedBranch].slice();
    var start = null;
    function ease(t) { return t < 0.5 ? 2 * t * t : -1 + (4 - 2 * t) * t; }
    function frame(ts) {
      if (!start) start = ts;
      var et = ease(Math.min((ts - start) / duration, 1));
      for (var i = 0; i < n; i++) {
        var x2 = slotX(oldOrder.indexOf(i)) + (slotX(newOrder.indexOf(i)) - slotX(oldOrder.indexOf(i))) * et;
        branchDots[i].setAttribute('cx', x2);
        branchLabelEls[i].setAttribute('x', x2);
        branchPaths[i].setAttribute('d', elbowPath(cx, Y0, x2, Y1, 0.35));

        var childCount = data.children[i].children.length;
        var fromOrder = i === movedBranch ? oldChildOrder : childOrders[i];
        var toOrder = i === movedBranch ? newChildOrder : childOrders[i];
        for (var j = 0; j < childCount; j++) {
          var fromOff = childOffset(childCount, fromOrder.indexOf(j));
          var toOff = childOffset(childCount, toOrder.indexOf(j));
          var x3 = x2 + fromOff + (toOff - fromOff) * et;
          leafCircles[i][j].setAttribute('cx', x3);
          leafLabelEls[i][j].setAttribute('x', x3);
          childPaths[i][j].setAttribute('d', elbowPath(x2, Y1, x3, Y2, 0.35));
        }
      }
      if (et < 1 && (ts - start) < duration) {
        requestAnimationFrame(frame);
      } else {
        currentOrder = newOrder;
        childOrders[movedBranch] = newChildOrder;
        if (done) done();
      }
    }
    requestAnimationFrame(frame);
  }

  function applyLayout() {
    for (var i = 0; i < n; i++) {
      var x2 = slotX(currentOrder.indexOf(i));
      branchDots[i].setAttribute('cx', x2);
      branchLabelEls[i].setAttribute('x', x2);
      branchPaths[i].setAttribute('d', elbowPath(cx, Y0, x2, Y1, 0.35));
      var childCount = data.children[i].children.length;
      for (var j = 0; j < childCount; j++) {
        var x3 = x2 + childOffset(childCount, childOrders[i].indexOf(j));
        leafCircles[i][j].setAttribute('cx', x3);
        leafLabelEls[i][j].setAttribute('x', x3);
        childPaths[i][j].setAttribute('d', elbowPath(x2, Y1, x3, Y2, 0.35));
      }
    }
  }

  data.children.forEach(function (branch, i) {
    var x2 = slotX(i);
    var y2 = Y1;

    var branchPath = el('path', {
      class: 'mm-connector',
      d: elbowPath(cx, Y0, x2, y2, 0.35),
      fill: 'none',
      stroke: 'var(--mm-line)',
      'stroke-width': '1.5',
      'stroke-linejoin': 'round'
    }, linesLayer);
    branchPaths[i] = branchPath;
    childPaths[i] = [];
    leafCircles[i] = [];
    leafLabelEls[i] = [];
    headerEls[i] = [];
    spineDots[i] = [];

    var childrenG = el('g', { class: 'mm-children', id: 'mm-children-' + i, 'aria-hidden': 'true' }, nodesLayer);
    childrenGEls[i] = childrenG;

    var branchG = el('g', {
      class: 'mm-branch',
      tabindex: '0',
      role: 'button',
      'aria-expanded': 'false',
      'aria-controls': 'mm-children-' + i,
      'aria-label': branch.label + ' 세부 항목 펼치기'
    }, nodesLayer);
    branchGEls[i] = branchG;
    branchDots[i] = el('circle', { class: 'mm-dot', cx: x2, cy: y2, r: dotR2, fill: branch.color }, branchG);
    branchLabelEls[i] = el('text', { class: 'mm-label-main', x: x2, y: y2 + dotR2 + 6, 'text-anchor': 'middle', 'dominant-baseline': 'hanging' }, branchG, branch.label);

    var childCount = branch.children.length;
    branch.children.forEach(function (child, j) {
      var x3 = x2 + childOffset(childCount, j);
      var y3 = Y2;

      var childPath = el('path', {
        class: 'mm-connector',
        d: elbowPath(x2, y2, x3, y3, 0.35),
        fill: 'none',
        stroke: 'var(--mm-line)',
        'stroke-width': '1',
        opacity: '0.8',
        'stroke-linejoin': 'round'
      }, childrenG);
      childPaths[i][j] = childPath;

      var leafG = el('g', {
        class: 'mm-leaf',
        tabindex: '-1',
        role: 'button',
        'aria-label': child.label + ' 항목, 관련 내용으로 이동'
      }, childrenG);
      leafCircles[i][j] = el('circle', { cx: x3, cy: y3, r: dotR3, fill: branch.color, opacity: '0.85' }, leafG);
      leafLabelEls[i][j] = el('text', { class: 'mm-label-sub', x: x3, y: y3 + dotR3 + 6, 'text-anchor': 'middle', 'dominant-baseline': 'hanging' }, leafG, child.label);

      leafG.addEventListener('click', function () { goToContent(i, j); });
      leafG.addEventListener('keydown', function (e) {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); goToContent(i, j); }
      });

      // 세부 항목에 대응하는 본문 섹션 (헤더 클릭 시 마인드맵으로 복귀)
      var section = document.createElement('section');
      section.className = 'mm-section';
      section.id = 'content-' + i + '-' + j;
      section.setAttribute('data-mm-branch', i);
      section.setAttribute('data-mm-leaf', j);

      // <h3>로 제목 시맨틱을 유지하고, 실제 클릭 대상은 그 안의 <button>.
      // (예전처럼 h3에 role="button"을 씌우면 제목 구조가 사라지고
      //  aria-label이 제목 텍스트까지 덮어써서 모든 헤더가 똑같이 읽힌다.)
      var header = document.createElement('h3');
      header.className = 'mm-section-header';

      var headerBtn = document.createElement('button');
      headerBtn.type = 'button';
      headerBtn.className = 'mm-section-header-btn';
      var currentMark = document.createElement('span');
      currentMark.className = 'mm-current-mark';
      currentMark.setAttribute('aria-hidden', 'true');
      headerBtn.appendChild(currentMark);
      headerBtn.appendChild(document.createTextNode(branch.label + ' · ' + child.label));
      headerBtn.setAttribute('aria-label', branch.label + ' · ' + child.label + ', 마인드맵으로 돌아가기');
      headerBtn.addEventListener('click', function () { goToMap(i, j); });
      header.appendChild(headerBtn);
      headerEls[i][j] = header;

      var body = document.createElement('div');
      body.className = 'mm-section-body';
      if (!child.render) body.textContent = child.text || '';

      section.appendChild(header);
      section.appendChild(body);
      contentContainer.appendChild(section);

      // render() runs only after the section is attached to the document —
      // it may need real layout (e.g. the 3D preview reads clientWidth/
      // clientHeight, which are 0 on a still-detached node).
      if (typeof child.render === 'function') child.render(body);

      // 스파인 위, 이 헤더와 만나는 지점의 점 (항상 표시 — 모든 헤더가 스파인에 연결돼 있음을 보여줌)
      var dot = el('circle', { class: 'mm-spine-dot', r: 4, fill: branch.color }, overlay);
      spineDots[i][j] = dot;
    });

    function toggle() {
      var isOpen = childrenG.classList.contains('open');
      var isLeftmost = currentOrder.indexOf(i) === 0;

      if (isOpen && isLeftmost) {
        // 이미 선택되어 열려있는(가장 왼쪽) 브랜치는 다시 눌러도 그대로 유지한다.
        return;
      }

      if (isOpen) {
        setChildrenState(i, false);
        // 닫히는 브랜치에 활성화된 안내선이 걸려 있었다면 함께 정리해 선이 끊긴 채 남지 않게 한다.
        if (activeBranchIndex === i) clearHighlight();
        return;
      }

      setChildrenState(i, true);
    }
    branchG.addEventListener('click', toggle);
    branchG.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggle();
      }
    });
  });

  document.getElementById('mindmap-root').appendChild(svg);

  // The compact view uses the same data tree, while the SVG remains available on wider screens.
  data.children.forEach(function (branch, i) {
    var details = document.createElement('details');
    var summary = document.createElement('summary');
    summary.textContent = branch.label;
    details.appendChild(summary);
    var list = document.createElement('ul');
    branch.children.forEach(function (child, j) {
      var item = document.createElement('li');
      var link = document.createElement('a');
      link.href = '#content-' + i + '-' + j;
      link.textContent = child.label;
      link.addEventListener('click', function (e) { e.preventDefault(); goToContent(i, j); });
      item.appendChild(link); list.appendChild(item);
    });
    details.appendChild(list); listView.appendChild(details);
  });

  svg.addEventListener('keydown', function (e) {
    if (['ArrowLeft', 'ArrowRight', 'ArrowUp', 'ArrowDown'].indexOf(e.key) === -1) return;
    var focusables = Array.prototype.slice.call(svg.querySelectorAll('.mm-branch, .mm-children.open .mm-leaf'));
    var at = focusables.indexOf(document.activeElement);
    if (at === -1) return;
    e.preventDefault();
    var next = e.key === 'ArrowLeft' || e.key === 'ArrowUp' ? at - 1 : at + 1;
    focusables[(next + focusables.length) % focusables.length].focus();
  });

  // 모든 좌표는 실제 렌더링된 픽셀 위치를 기준으로 계산한다 (반응형 대응)
  // 화면 중앙의 좁은 밴드에 들어온 본문을 현재 읽는 섹션으로 삼는다. 콜백은
  // 이미 배치된 spineDots의 좌표만 읽으며, 레이아웃을 다시 계산하지 않는다.
  function updateScrollProgressDot(section) {
    if (!section) return;
    var i = Number(section.getAttribute('data-mm-branch'));
    var j = Number(section.getAttribute('data-mm-leaf'));
    if (svgMapVisible()) {
      var sourceDot = spineDots[i] && spineDots[i][j];
      if (!sourceDot) return;

      var cy = Number(sourceDot.getAttribute('cy'));
      var spineX = getSpineX();
      if (!isFinite(cy) || !isFinite(spineX)) return;

      scrollProgressDot.setAttribute('cx', spineX);
      scrollProgressDot.setAttribute('cy', cy);
      scrollProgressDot.setAttribute('visibility', 'visible');
      return;
    }

    var header = headerEls[i] && headerEls[i][j];
    var mark = header && header.querySelector('.mm-current-mark');
    if (!mark) return;

    if (!isFinite(mobileTrackX)) layoutMobileTrack();
    if (!isFinite(mobileTrackX)) return;

    var markPoint = pointOf(mark);
    mobileScrollDot.setAttribute('cx', mobileTrackX);
    mobileScrollDot.setAttribute('cy', markPoint[1]);
    mobileScrollDot.setAttribute('visibility', 'visible');
  }

  function setupScrollProgressObserver() {
    if (typeof IntersectionObserver === 'undefined') return;
    var sections = Array.prototype.slice.call(contentContainer.querySelectorAll('.mm-section'));
    var observed = [];
    var observer = new IntersectionObserver(function (entries) {
      entries.forEach(function (entry) {
        var index = observed.indexOf(entry.target);
        if (entry.isIntersecting) {
          if (index === -1) observed.push(entry.target);
        } else if (index !== -1) {
          observed.splice(index, 1);
        }
      });
      if (!observed.length) return;

      var viewportCenter = window.innerHeight / 2;
      var closest = observed[0];
      var closestDistance = Infinity;
      observed.forEach(function (section) {
        var rect = section.getBoundingClientRect();
        var distance = Math.abs(rect.top + rect.height / 2 - viewportCenter);
        if (distance < closestDistance) {
          closest = section;
          closestDistance = distance;
        }
      });
      if (closest !== scrollCurrentSection) {
        scrollCurrentSection = closest;
        updateScrollProgressDot(closest);
      }
    }, { rootMargin: '-45% 0px -45% 0px', threshold: 0 });

    sections.forEach(function (section) { observer.observe(section); });
  }

  function layoutLeaderLines() {
    // Measured from the footer's own position, not document.documentElement.
    // scrollHeight/scrollWidth — those include the overlay's own previous
    // size (it's position:absolute over the whole page), so sizing from
    // them would let one inflated reading ratchet the overlay (and the
    // page) taller forever with no way back down.
    var scrollX = window.pageXOffset;
    var scrollY = window.pageYOffset;

    var footerRect = document.querySelector('footer').getBoundingClientRect();
    var docW = Math.max(document.documentElement.clientWidth, footerRect.right + scrollX);
    var docH = footerRect.bottom + scrollY;
    overlay.setAttribute('width', docW);
    overlay.setAttribute('height', docH);
    overlay.style.width = docW + 'px';
    overlay.style.height = docH + 'px';

    layoutMobileTrack();

    var spineX = getSpineX();
    var minY = Infinity, maxY = -Infinity;

    for (var i = 0; i < headerEls.length; i++) {
      for (var j = 0; j < headerEls[i].length; j++) {
        var headerRect = headerEls[i][j].getBoundingClientRect();
        var yb = headerRect.top + headerRect.height / 2 + scrollY;

        spineDots[i][j].setAttribute('cx', spineX);
        spineDots[i][j].setAttribute('cy', yb);

        if (yb < minY) minY = yb;
        if (yb > maxY) maxY = yb;
      }
    }

    spineLine.setAttribute('d', 'M ' + spineX + ' ' + minY + ' L ' + spineX + ' ' + maxY);

    // 노드/헤더가 움직였으므로 떠 있는 강조선도 새 좌표로 맞춘다.
    refreshHighlightGeometry();
    // 스크롤 진행 점도 마찬가지 — 리사이즈로 헤더 y좌표가 바뀌면 그 값을
    // 다시 읽어와야, 다음에 "현재 섹션"이 바뀔 때까지 낡은 위치에 멈춰
    // 있지 않는다.
    if (scrollCurrentSection) updateScrollProgressDot(scrollCurrentSection);
  }

  requestAnimationFrame(layoutLeaderLines);
  requestAnimationFrame(layoutMobileTrack);
  // 첫 레이아웃 이후에 관찰을 시작해야 spineDots의 cy를 바로 읽을 수 있다.
  requestAnimationFrame(setupScrollProgressObserver);
  // 150ms 디바운스는 리사이즈 도중 파란 강조선이 눈에 띄게 뒤처져 보이게 만들었다.
  // 대신 프레임당 한 번만 실행되도록 rAF로 스케줄링해 화면이 바뀌는 것과 거의 동시에 따라가게 한다.
  var layoutScheduled = false;
  function scheduleLayoutLeaderLines() {
    if (layoutScheduled) return;
    layoutScheduled = true;
    requestAnimationFrame(function () {
      layoutScheduled = false;
      layoutLeaderLines();
    });
  }
  window.addEventListener('resize', scheduleLayoutLeaderLines);
  if (typeof ResizeObserver !== 'undefined') {
    // 창 크기뿐 아니라 마인드맵 컨테이너 자체의 레이아웃이 바뀌는 경우(글꼴 로드,
    // 콘텐츠 리플로우 등)도 함께 잡아낸다.
    new ResizeObserver(scheduleLayoutLeaderLines).observe(document.getElementById('mindmap-root'));
  }
})();
</script>

</body>
</html>
